//
// proto/kernel/v1/events/v1/events.proto
// =============================================================================
// kernel-v1 — semantic event contract (v1)
//
// This is the authoritative wire format the BPF sensors emit through the
// shared ring buffer, the Rust node agent normalises, the control plane
// durably persists in Kafka, the dashboard consumes over WebSocket, and
// the rule engine matches against. Every field number, every enum value,
// every oneof variant is intentionally reserved here. Removing a field,
// reusing a field number, or widening a oneof to a new variant without
// bumping `schema_major` is a wire-compatibility break that
// `buf breaking --against .git#<baseline>` will reject.
//
// Semantic discipline (per the approved plan, OWN_LSM_DENY + ATTEMPT/RESULT
// + ESTABLISHED + DNS_PACKET):
//
//   * LsmDeny represents an `OWN_LSM_DENY` only — the agent's own BPF
//     LSM program returned -EPERM. We DO NOT promote other components'
//     denials (LSM_DENY_OTHER) into this enum; tasks 30/31 will keep
//     that surface narrow and audited.
//   * NetworkConnect/NetworkAccept always carry both the attempt and
//     the result errno; "ESTABLISHED" is the boolean field on the
//     result, NOT a separate kind.
//   * DnsPacket is a captured packet — it is NOT a resolver-lookup
//     claim. /etc/hosts, getaddrinfo, DoH/DoT/DoQ are never mapped
//     onto DNS_PACKET.
//   * ProcessExecResult covers both successful and failed exec. We do
//     NOT promote a successful exec into PROCESS_EXIT; the latter
//     carries a separate event_id + seq.
//
// Field numbering rules:
//   1. Never reuse a retired number. `buf breaking --against .git#<v1>`
//      will reject the next attempt.
//   2. New fields on existing messages always get the next number.
//   3. New oneof variants never reuse a numeric tag.
//
// All event IDs are opaque strings; the (boot_id, agent_generation,
// seq) tuple is the durable identity used by every downstream consumer.
//
// =============================================================================

syntax = "proto3";

package kernel.v1.events.v1;

import "google/protobuf/timestamp.proto";

// -----------------------------------------------------------------------------
// Enums
// -----------------------------------------------------------------------------

// EventKind enumerates every semantic event the platform can emit. The
// zero value is reserved for the UNSPECIFIED sentinel (lint rule
// ENUM_ZERO_VALUE_SUFFIX). New kinds must be appended with the next
// number and the corresponding oneof variant must be added to Event.
// Removing or renumbering a value is a wire-compatibility break.
enum EventKind {
  // Zero value; reject at the consumer.
  EVENT_KIND_UNSPECIFIED = 0;

  // Process lifecycle.
  EVENT_KIND_PROCESS_FORK = 1;
  // Exec result (success or failure) is a single event kind; the
  // success bit lives in ProcessExecResult.
  EVENT_KIND_PROCESS_EXEC_RESULT = 2;
  EVENT_KIND_PROCESS_EXIT = 3;

  // File operations (bounded — see the file sensor coverage manifest).
  EVENT_KIND_FILE_OPEN = 4;
  EVENT_KIND_FILE_CREATE = 5;
  EVENT_KIND_FILE_UNLINK = 6;
  EVENT_KIND_FILE_RENAME = 7;

  // Network lifecycle (attempt, result, state).
  EVENT_KIND_NETWORK_CONNECT = 8;
  EVENT_KIND_NETWORK_ACCEPT = 9;
  EVENT_KIND_NETWORK_STATE = 10;

  // DNS — captured packet, NOT a resolver lookup claim.
  EVENT_KIND_DNS_PACKET = 11;

  // Syscall latency (configured allowlist; histograms, not stream).
  EVENT_KIND_SYSCALL_ENTER = 12;
  EVENT_KIND_SYSCALL_EXIT = 13;

  // BPF LSM denial. Only OWN_LSM_DENY (the platform's own program
  // returned -EPERM). LSM_DENY_OTHER and LSM_DENY_FINAL are
  // explicitly rejected by the plan and are NOT enumerated.
  EVENT_KIND_LSM_DENY_OWN = 14;

  // Identity / credential facts (cgroup, namespaces, credentials).
  EVENT_KIND_IDENTITY = 15;
}

// CgroupMode mirrors Compatibility.cgroup_mode.
enum CgroupMode {
  CGROUP_MODE_UNSPECIFIED = 0;
  CGROUP_MODE_UNIFIED = 1;
  CGROUP_MODE_HYBRID = 2;
  CGROUP_MODE_LEGACY = 3;
  CGROUP_MODE_UNKNOWN = 4;
}

// -----------------------------------------------------------------------------
// Identity primitives — present on every payload as a flat block
// -----------------------------------------------------------------------------

// Identity is the platform's per-task attribution surface. Every field
// is independently validity-tagged; absence is recorded as valids ==
// {field_name: false}, never as a zero/empty value. Booleans in valids
// are REQUIRED for every field whose value could be a default-zero
// artifact of uninitialised memory.
message Identity {
  // Linux pid_tgid in the upper 32 bits.
  uint64 pid_tgid = 1;
  // bpf_ktime_get_ns() of task creation.
  uint64 task_start_time_ns = 2;
  // bpf_get_current_cgroup_id() — only valid on cgroup v2; check
  // valids.cgroup_id.
  uint64 cgroup_id = 3;
  // Mount namespace inode.
  uint64 mount_ns_id = 4;
  // PID namespace inode (the active PID ns at emit time, distinct
  // from the user/credential namespace).
  uint64 pid_ns_id = 5;
  // Net namespace inode.
  uint64 net_ns_id = 6;
  // User namespace inode.
  uint64 user_ns_id = 7;
  // UTS namespace inode.
  uint64 uts_ns_id = 8;
  // IPC namespace inode.
  uint64 ipc_ns_id = 9;
  // Time namespace inode.
  uint64 time_ns_id = 10;
  // Effective UID at emit time (no kernel-derived claim beyond CAP).
  uint32 uid = 11;
  // Effective GID at emit time.
  uint32 gid = 12;
  // Login UID (audit-formatted) when readable; -1 when not.
  uint32 loginuid = 13;
  // bpf_get_current_pid_tgid() of the *parent* (only valid for fork).
  uint64 parent_pid_tgid = 14;
  // Per-field validity map. Missing or false = field is invalid.
  // Consumers MUST consult this map before drawing a kernel-identity
  // claim; default-zero is not a substitute for explicit invalidity.
  map<string, bool> valids = 15;
}

// -----------------------------------------------------------------------------
// Process payloads
// -----------------------------------------------------------------------------

// ProcessFork — the new task has just been created by sched_process_fork.
// The child identity block is required; parent identity is in
// `parent_pid_tgid` + valids.
message ProcessFork {
  Identity child = 1;
  // Whether the child is a thread (CLONE_THREAD set) or a process.
  bool is_thread = 2;
}

// ProcessExecResult — covers both successful and failed exec. The
// success/failure distinction is in the `succeeded` field; the result
// errno lives in `errno_value`. Consumers MUST treat PROCESS_EXIT as
// a separate event; a successful exec is not a "process exit".
message ProcessExecResult {
  Identity task = 1;
  // Resolved binary path, capped at PATH_MAX.
  string binary_path = 2;
  // Raw argv bytes; truncated to the bounded argv ring budget and
  // redacted per the privacy redaction list before persistence.
  bytes argv_bytes = 3;
  // True if the exec syscall returned >= 0.
  bool succeeded = 4;
  // Saved errno on failure (0 on success).
  int32 errno_value = 5;
  // Whether the original argv ring was truncated.
  bool argv_truncated = 6;
}

// ProcessExit — task_exit. Correlates with the originating fork via
// (boot_id, agent_generation, Identity.pid_tgid, Identity.task_start_time_ns).
message ProcessExit {
  Identity task = 1;
  // exit_code as delivered to do_exit().
  int32 exit_code = 2;
  // True if this was exit_group, not exit.
  bool exit_group = 3;
  // True if the kernel flag `group_dead` was observed (current
  // kernels only); false means the field is unavailable.
  bool group_dead_observed = 4;
}

// -----------------------------------------------------------------------------
// File payloads
// -----------------------------------------------------------------------------

// FileOpen — BPF LSM `file_open` (or the syscall fallback when the
// LSM is unavailable). The deny source is recorded so consumers can
// distinguish an LSM deny from a syscall EPERM.
message FileOpen {
  Identity task = 1;
  // Resolved path (kernel-side, bounded).
  string path = 2;
  // O_RDONLY / O_WRONLY / O_RDWR + O_* flags (encoded in O_* form).
  uint32 flags = 3;
  // True if the open returned >= 0.
  bool succeeded = 4;
  // errno on failure.
  int32 errno_value = 5;
  // True if emitted from the BPF LSM `file_open` hook; false means
  // the syscall fallback (degraded path) was used.
  bool from_lsm = 6;
}

// FileCreate — `creat`/`open(O_CREAT)`. May share a path with FileOpen
// when the same syscall both creates and opens; the consumer de-dups.
message FileCreate {
  Identity task = 1;
  string path = 2;
  uint32 flags = 3;
  uint32 mode = 4;
  bool succeeded = 5;
  int32 errno_value = 6;
  bool from_lsm = 7;
}

// FileUnlink — `unlink` / `unlinkat` / `rmdir`.
message FileUnlink {
  Identity task = 1;
  string path = 2;
  // True when the unlink targeted a directory (rmdir-like).
  bool is_dir = 3;
  bool succeeded = 4;
  int32 errno_value = 5;
  bool from_lsm = 6;
}

// FileRename — `rename` / `renameat` / `renameat2`.
message FileRename {
  Identity task = 1;
  string source_path = 2;
  string dest_path = 3;
  bool succeeded = 4;
  int32 errno_value = 5;
  bool from_lsm = 6;
}

// -----------------------------------------------------------------------------
// Network payloads
// -----------------------------------------------------------------------------

// NetworkConnect — cgroup connect4/connect6 emits the attempt;
// sys_connect exit emits the result. They share (task, socket_cookie)
// and the consumer stitches them. `established` is true only when
// the connect syscall returned >= 0; nonblocking `EINPROGRESS` is
// recorded in errno_value.
message NetworkConnect {
  Identity task = 1;
  // Socket cookie from bpf_get_socket_cookie; the durable identity.
  uint64 socket_cookie = 2;
  // AF_INET or AF_INET6.
  uint32 family = 3;
  // Big-endian; for AF_INET, last 4 bytes hold the address.
  bytes local_addr = 4;
  bytes remote_addr = 5;
  uint32 local_port = 6;
  uint32 remote_port = 7;
  // True if this is the result event (syscall exit). False if this
  // is the attempt event (cgroup connect hook).
  bool is_result = 8;
  // True iff the connect returned >= 0 (synchronous success).
  // For EINPROGRESS, this is false and the consumer must wait for
  // a NETWORK_STATE change to ESTABLISHED before drawing the
  // "established" claim.
  bool established = 9;
  int32 errno_value = 10;
  // True if emitted from the cgroup connect4/connect6 hook; false
  // means the syscall fallback was used.
  bool from_cgroup = 11;
}

// NetworkAccept — accept/accept4 result. We do NOT emit the peer
// data on a non-positive returned FD; a refusal is the only honest
// emit.
message NetworkAccept {
  Identity task = 1;
  uint64 socket_cookie = 2;
  uint32 family = 3;
  bytes local_addr = 4;
  bytes remote_addr = 5;
  uint32 local_port = 6;
  uint32 remote_port = 7;
  int32 returned_fd = 8;
  bool succeeded = 9;
  int32 errno_value = 10;
}

// NetworkState — inet sock state transition. The plan forbids claiming
// ESTABLISHED from a NETWORK_STATE without a successful connect/accept;
// this event is the observable state change, NOT the success claim.
message NetworkState {
  Identity task = 1;
  uint64 socket_cookie = 2;
  // Kernel TCP state number (per include/net/tcp_states.h).
  uint32 old_state = 3;
  uint32 new_state = 4;
}

// -----------------------------------------------------------------------------
// DNS payload
// -----------------------------------------------------------------------------

// DnsPacket — bounded cleartext DNS packet (port 53). Encrypted DNS
// (DoH/DoT/DoQ) and /etc/hosts / cache resolution MUST NOT be mapped
// onto this event kind.
message DnsPacket {
  Identity task = 1;
  // True for the captured query, false for the captured response.
  bool is_query = 2;
  // Transport (SOCK_STREAM = TCP, SOCK_DGRAM = UDP).
  uint32 transport = 3;
  // Full bounded packet bytes (decoder limit: 512 bytes UDP, 4096
  // bytes TCP, both inclusive of framing).
  bytes packet_bytes = 4;
  // True if the packet was longer than the decoder limit and was
  // truncated before persistence.
  bool truncated = 5;
  // Direction (true = egress to server, false = ingress from client).
  bool is_egress = 6;
}

// -----------------------------------------------------------------------------
// Syscall payloads
// -----------------------------------------------------------------------------

// SyscallEnter — per-TID raw sys_enter sample. The plan allows only a
// configured allowlist; emit this only for allow-listed syscalls.
message SyscallEnter {
  Identity task = 1;
  int32 syscall_nr = 2;
  uint64 ts_monotonic_ns = 3;
  // Compat-translated NR (when the running kernel is 32-bit compat).
  int32 compat_syscall_nr = 4;
}

// SyscallExit — per-TID raw sys_exit sample, with elapsed wall/boot
// latency. NO_RETURN and ORPHAN_* are special semantics; ORPHAN_ENTER
// and ORPHAN_EXIT counters are emitted separately over the health
// stream and are NOT encoded here.
message SyscallExit {
  Identity task = 1;
  int32 syscall_nr = 2;
  uint64 ts_monotonic_ns = 3;
  int64 elapsed_ns = 4;
  int32 compat_syscall_nr = 5;
  // True if the kernel signals a NO_RETURN semantic (e.g. execve
  // success, exit_group).
  bool no_return = 6;
  int32 errno_value = 7;
}

// -----------------------------------------------------------------------------
// LSM denial payload (OWN only)
// -----------------------------------------------------------------------------

// LsmDeny — emitted ONLY when the platform's own BPF LSM program
// returned -EPERM. Other components' denials are NOT mapped onto this
// event kind. The plan forbids claims like "final LSM denial".
message LsmDeny {
  Identity task = 1;
  // The hook name as it appears in bpf_lsm_*; e.g. "file_open",
  // "bprm_check_security", "socket_connect".
  string hook = 2;
  // The path or socket tuple that triggered the deny, encoded as a
  // bounded UTF-8 string. For non-path hooks, this carries the
  // canonical hook argument summary.
  string subject = 3;
  // True when the deny link was the platform's own program
  // (always true here; the field exists for forward-compat with
  // the audit-record surface and to make the v1 contract explicit).
  bool own_deny = 4;
  // The policy version that produced the deny (string form of the
  // PolicyStatus.version).
  string policy_version = 5;
  // Stable deny digest: the consumer's audit pipeline stores this
  // for replay.
  bytes policy_digest = 6;
}

// -----------------------------------------------------------------------------
// Batch envelope
// -----------------------------------------------------------------------------

// Batch is the unit the agent emits over the gRPC stream and the
// control plane durably stores. Field 2 is intentionally reserved
// (a now-removed `string id` in an internal draft) so any future
// change cannot collide with the historic schema.
message Batch {
  // Wire-format schema version. Bumped on a backward-incompatible
  // wire change. schema_minor is bumped for additive changes that
  // do not break the existing field numbers.
  uint32 schema_major = 1;
  // reserved 2; documented above.
  reserved 2;
  // The string `id` field was retired; replaced by
  // (agent_generation, boot_id, node_name). The reserved field 2
  // guarantees no future contract can silently reuse that number.
  string reserved_tag = 3 [json_name = "reserved"];
  uint32 schema_minor = 4;
  // Every event in this batch, in monotonic order. Sequence gaps
  // inside a batch are reported via the ring-buffer health counters,
  // not inside the batch.
  repeated Event events = 5;
  // Monotonic per-agent generation; the agent increments it on every
  // restart.
  string agent_generation = 6;
  // The node's hostname / node name (operator-set).
  string node_name = 7;
  // Linux boot_id (16 bytes, raw). Used as the durable key the
  // consumer combines with agent_generation to dedupe across agent
  // restarts.
  bytes boot_id = 8;
}

// Event is the union of every payload kind the platform can emit.
// One and only one of the oneof variants is set per event; consumers
// MUST NOT assume which one without consulting the discriminator.
message Event {
  // Stable event id (UUIDv7 or platform-equivalent). Combined with
  // (boot_id, agent_generation) it is globally unique.
  string event_id = 1;
  // Per-batch monotonic sequence.
  uint64 seq = 2;
  // bpf_ktime_get_ns() at emit time.
  uint64 ts_monotonic_ns = 3;
  // Wall-clock timestamp; the agent populates this from CLOCK_REALTIME
  // at batch finalisation.
  google.protobuf.Timestamp ts_wall = 4;
  // Logical sensor name (e.g. "process", "file", "network"). Used
  // for filtering and the rule engine's sensor facet.
  string sensor = 5;
  // Semantic kind; MUST match the set oneof variant.
  EventKind event_kind = 6;
  // Per-event validity map. Each named field can declare its own
  // validity; the rule engine consults these to refuse to match
  // against fields the sensor could not observe.
  map<string, bool> valids = 7;
  // Kernel-side kfuncs used to produce this event. Recorded for
  // diagnostics; the platform does NOT make capability claims based
  // on this list.
  repeated string kfuncs_used = 8;

  // Payload. Exactly one variant is set per event; the consumer
  // dispatches on `event_kind` to read the matching field.
  oneof payload {
    ProcessExecResult process_exec_result = 100;
    ProcessFork process_fork = 101;
    ProcessExit process_exit = 102;
    FileOpen file_open = 103;
    FileCreate file_create = 104;
    FileUnlink file_unlink = 105;
    FileRename file_rename = 106;
    NetworkConnect network_connect = 107;
    NetworkAccept network_accept = 108;
    NetworkState network_state = 109;
    DnsPacket dns_packet = 110;
    SyscallEnter syscall_enter = 111;
    SyscallExit syscall_exit = 112;
    LsmDeny lsm_deny = 113;
    Identity identity = 114;
  }
}
