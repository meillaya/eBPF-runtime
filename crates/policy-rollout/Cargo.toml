# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "policy-rollout"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "Fleet two-phase policy rollout: distributed STAGE→READY→COMMIT→APPLIED/REJECTED state machine, reconciliation, rollback, idempotent SPIFFE-bound commands, and full audit (task 43)."
publish = false

[lib]
name = "policy_rollout"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
