# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "bpf-loader"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Load the compiled BPF sensors and attach their observation programs."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "bpf_loader"
path = "src/lib.rs"

[[bin]]
name = "bpf-loader"
path = "src/main.rs"

[dependencies]
libbpf-rs = { version = "0.26", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
bpf-build = { path = "../bpf-build" }
