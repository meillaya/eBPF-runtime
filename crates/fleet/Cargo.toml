# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "fleet"
version = "0.3.0"
edition = "2021"
rust-version = "1.95.0"
description = "ebpf-fleet: local-first kernel recording, query, and replay."
license = "Apache-2.0 OR MIT"
publish = false

[[bin]]
name = "ebpf-fleet"
path = "src/main.rs"

[dependencies]
arrow = { version = "59.2.0", features = ["prettyprint", "json", "csv"] }
bpf-loader = { path = "../bpf-loader" }
bundle = { path = "../bundle" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
crossterm = "0.29.0"
ratatui = "0.30.2"
event-model = { path = "../event-model" }
futures = "0.3"
parquet = "59.2.0"
probe = { path = "../probe" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
signal-hook = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
csv = "1"
nix = { version = "0.31", features = ["fs", "poll", "process", "term"] }
tempfile = "3"
