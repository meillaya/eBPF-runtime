# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Command line runtime for the eBPF process and file sensors."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "runtime"
path = "src/lib.rs"

[[bin]]
name = "ebpf-runtime"
path = "src/main.rs"

[dependencies]
bpf-loader = { path = "../bpf-loader" }
event-abi = { path = "../event-abi" }
event-model = { path = "../event-model" }
rules = { path = "../rules" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
