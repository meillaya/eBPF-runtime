# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "OIDC PKCE/device authentication and server-side RBAC for the eBPF runtime security control plane (task 37)."
publish = false

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
parking_lot = "0.12"
rand = "0.9"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
