# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "event-bus-kafka"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "Control-plane Kafka event publisher: idempotent producer (acks=all), per-agent partition ordering, protobuf schema/version headers, durable-delivery callback for gRPC ACK, events.dlq.v1 dead-letter path, timeout/backpressure metrics. Agents never see Kafka (control-plane only). At-least-once with declared duplicates; no cross-session exactly-once claim."
publish = false

[lib]
name = "event_bus_kafka"
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
transport = { path = "../transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
