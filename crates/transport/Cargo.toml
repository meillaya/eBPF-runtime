# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Agent-side gRPC transport with mTLS and SPIFFE peer checks."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "transport"
path = "src/lib.rs"

[dependencies]
event-model = { path = "../event-model" }
protocol = { path = "../protocol" }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
x509-parser = "0.18"
