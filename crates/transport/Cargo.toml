# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "Agent/control-plane gRPC transport: separate deadline-bound control and event streams, SPIFFE peer authorization, boot/agent generation sequence reconciliation, bounded independent queues, deterministic batch ACK after durable Kafka acceptance, SQLite outbox deletion after matching ACK (task 39)."
publish = false

[lib]
name = "transport"
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
identity-spiffe = { path = "../identity-spiffe" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
tempfile = "3"
