[package]
name = "preflight-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Typed parser + validator for the kernel-v1 host compatibility preflight report (schema v1)."
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
jsonschema = "0.48.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "validate-preflight"
path = "src/bin/validate_preflight.rs"

[lib]
name = "preflight_schema"
path = "src/lib.rs"
