# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "control-plane"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "Authenticated stateless control-plane query and live-stream API for the eBPF runtime security platform (task 42)."
publish = false

[lib]
name = "control_plane"
path = "src/lib.rs"

[dependencies]
auth = { path = "../auth" }
control-db = { path = "../control-db" }
analytics-clickhouse = { path = "../analytics-clickhouse" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
