[package]
name = "sensor-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "kernel-v1 sensor harness integration tests (task 11 — process lifecycle decoder fixtures)."
license = "Apache-2.0 OR MIT"
publish = false

# This crate has no library surface: it exists purely so that
# `cargo test -p sensor-tests --test process_events` can decode the
# committed `.binpb` fixtures under `tests/fixtures/process/` and
# assert the task-11 acceptance criteria. The recorder helper that
# generates fresh fixtures from a privileged runner is exposed as a
# separate `[[bin]]` (NOT invoked by `cargo test`; see
# `src/bin/record-fixtures.rs`).
autolib = false
autobins = false

[[bin]]
name = "record-fixtures"
path = "src/bin/record-fixtures.rs"
required-features = []

[dependencies]
# `bpf-build` is a runtime dep of the `record-fixtures` bin only
# (NOT used by `cargo test`). Pulling it here means `cargo test`
# also compiles the bin, which triggers `bpf-build`'s own build.rs
# (clang + bpftool + placeholder.bpf.c compile). That is the
# intended behaviour: the bin's `cargo check` + compile is a
# smoke test that the wiring the privileged runner will use (task 53+)
# still type-checks. The pinned vmlinux.h digest check in
# `bpf-build`'s `EXPECTED_SHA256` runs at the bpf-build crate's own
# `build()` invocation (which `record-fixtures` calls at runtime),
# NOT at compile time, so `cargo test` succeeds on a host whose
# /sys/kernel/btf/vmlinux digest differs from the pin.
bpf-build = { path = "../bpf-build" }

[dev-dependencies]
event-abi = { path = "../event-abi" }