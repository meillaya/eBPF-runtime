[package]
name = "bpf-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Compile the eBPF sensors in bpf/sensors into relocatable CO-RE objects."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "bpf_build"
path = "src/lib.rs"

[[bin]]
name = "bpf-build"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
thiserror = "2"
