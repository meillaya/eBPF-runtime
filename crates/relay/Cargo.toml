# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "PostgreSQL to Kafka and ClickHouse projection relay."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "ebpf-relay"
path = "src/main.rs"

[dependencies]
analytics-clickhouse = { path = "../analytics-clickhouse" }
clap = { version = "4", features = ["derive"] }
control-db = { path = "../control-db" }
event-bus-kafka = { path = "../event-bus-kafka" }
event-model = { path = "../event-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
