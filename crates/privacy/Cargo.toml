# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "privacy"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Typed privacy policy and mandatory redaction/data-minimization stage applied before every persistence and export boundary (SQLite, alerts, logs, Kafka, REST, WebSocket)."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "privacy"
path = "src/lib.rs"

[[bin]]
name = "redaction-cli"
path = "src/bin/redaction-cli.rs"

[dependencies]
event-abi = { path = "../event-abi" }
agent-core = { path = "../agent-core" }
enrichment = { path = "../enrichment" }
regex = "1"
regex-automata = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
