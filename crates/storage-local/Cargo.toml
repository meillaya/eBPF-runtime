# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "storage-local"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Bounded SQLCipher local history and durable outbox for the eBPF runtime security agent."
publish = false

[lib]
name = "storage_local"
path = "src/lib.rs"

[[bin]]
name = "storage-cli"
path = "src/bin/storage-cli.rs"

[dependencies]
event-abi = { path = "../event-abi" }
agent-core = { path = "../agent-core" }
privacy = { path = "../privacy" }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
