# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "storage-local"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "Encrypted local event store and durable outbox for the agent."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "storage_local"
path = "src/lib.rs"

[dependencies]
event-model = { path = "../event-model" }
parking_lot = "0.12"
rand = "0.9"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
