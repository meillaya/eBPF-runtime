# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# cargo-fuzz harness crate for the storage-local SQLCipher boundary
# (LocalStorage::open against corrupt DB files, truncated/garbage WAL files,
# and wrong encryption keys). Separate workspace (empty `[workspace]` detaches
# it from the parent kernel-v1 workspace) so `cargo test --workspace` and the
# main lock are unaffected. Each iteration uses an auto-cleaned temp dir; no
# external services. Run via `cargo fuzz` (see README.md / top-level FUZZING.md).

[package]
name = "storage-local-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
storage-local = { path = ".." }
tempfile = "3"

# Detach from the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "open_corrupt_db"
path = "fuzz_targets/open_corrupt_db.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wrong_key"
path = "fuzz_targets/wrong_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "truncated_wal"
path = "fuzz_targets/truncated_wal.rs"
test = false
doc = false
bench = false
