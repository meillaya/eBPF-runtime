# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "Typed fleet protocol contracts: AgentIdentity, EventBatch, BatchAck, Health, Compatibility, PolicySnapshot, policy activation and batch ACK state machines, deadlines, idempotency keys, typed status/error codes, compression/message bounds (task 35)."
publish = false

[lib]
name = "protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
