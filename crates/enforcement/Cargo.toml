# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "enforcement"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0 OR MIT"
description = "Agent-side staged policy activation: double-buffered map generations, content digest verification, STAGE→READY→COMMIT→APPLIED/REJECTED state machine, kill switch, rollback, and fail-open lifecycle (task 34)."
publish = false

[lib]
name = "enforcement"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
