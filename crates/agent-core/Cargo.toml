# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "agent_core"
path = "src/lib.rs"

[[bin]]
name = "agent-core-stream"
path = "src/bin/agent-core-stream.rs"

[dependencies]
event-abi = { path = "../event-abi" }
libbpf-rs = { version = "0.26", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
