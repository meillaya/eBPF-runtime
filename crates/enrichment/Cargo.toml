# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "enrichment"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "CRI / containerd / CRI-O / Docker / Kubernetes enrichment adapters for kernel events; preserves raw kernel identity, scoped attribution, and bounded TTL caching."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "enrichment"
path = "src/lib.rs"

[[example]]
name = "identify-scope"
path = "examples/identify_scope.rs"

[dependencies]
event-abi = { path = "../event-abi" }
agent-core = { path = "../agent-core" }
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }