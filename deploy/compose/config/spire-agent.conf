# SPIRE agent configuration for kernel-v1 local development.
#
# SECURITY: DEV-ONLY. Connects to the dev SPIRE server over the
# Docker network. The join token is generated at runtime by the
# entrypoint script (spire-agent-entrypoint.sh).
#
# Consumed by: deploy/compose/dev-infra.yml (spire-agent service)
# Mounted at:  /etc/spire/agent.conf

agent {
    data_dir       = "/run/spire/agent"
    log_level      = "DEBUG"
    server_address = "spire-server"
    server_port    = "8081"
    socket_path    = "/tmp/spire-agent/public/api.sock"
    trust_domain   = "example.org"

    # Insecure mode for dev (no TLS between agent and server).
    # Production uses mutual TLS with a bootstrap bundle.
    insecure_bootstrap = true
}

plugins {
    # Join token attestor: the agent presents a one-time token
    # generated by `spire-server token generate`.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # In-memory key manager for dev.
    KeyManager "memory" {
        plugin_data {}
    }

    # Unix workload attestor: identifies workloads by UID/GID/binary path.
    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
            trust_uid_0            = true
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
