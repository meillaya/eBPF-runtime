# SPIRE server configuration for kernel-v1 local development.
#
# SECURITY: DEV-ONLY. Trust domain "example.org" is a placeholder.
# Production deployment uses a real trust domain with SPIRE-issued SVIDs.
#
# Consumed by: deploy/compose/dev-infra.yml (spire-server service)
# Mounted at:  /etc/spire/server.conf

server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    trust_domain = "example.org"
    data_dir     = "/run/spire/data"
    log_level    = "DEBUG"

    # CA TTL for dev (shorter than production).
    ca_ttl = "1h"

    # Default SVID TTL for dev workloads.
    default_x509_svid_ttl = "30m"

    # JWT issuer for SVID JWT tokens.
    jwt_issuer = "https://spire-server.example.org"
}

plugins {
    # Dev datastore: sqlite3 (file-backed for restart persistence).
    # Production uses MySQL/PostgreSQL.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    # Node attestor: join_token for dev agent bootstrapping.
    # The agent obtains a one-time token via `spire-server token generate`.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # In-memory key manager for dev (no HSM).
    KeyManager "memory" {
        plugin_data {}
    }

    # Upstream authority: self-signed for dev.
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/run/spire/data/ca.crt"
            key_file_path  = "/run/spire/data/ca.key"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
