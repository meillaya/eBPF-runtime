# SPDX-License-Identifier: Apache-2.0 OR MIT
# kernel-v1 local development infrastructure.
#
# Services: PostgreSQL 16, Kafka (KRaft), ClickHouse 24.8,
#           SPIRE server + agent, Dex OIDC.
#
# SECURITY: ALL credentials are DEV-ONLY. Never use in production.
# All host port bindings are on 127.0.0.1 (loopback only).
#
# Usage:
#   devenv tasks run infra:up      # start all services
#   devenv tasks run infra:down    # stop all services
#   devenv tasks run infra:status  # health summary
#   devenv tasks run infra:logs    # tail logs
#   devenv tasks run infra:reset   # destroy volumes
#
# Or directly:
#   docker compose -f deploy/compose/dev-infra.yml up -d

name: kernel-v1-dev

services:
  # -------------------------------------------------------------------
  # PostgreSQL 16 — control-plane database
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: k1-postgres
    environment:
      POSTGRES_DB: kernel_v1
      POSTGRES_USER: control_app
      POSTGRES_PASSWORD: dev-only-not-prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kernel-v1-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_app -d kernel_v1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Kafka KRaft — single-node event bus (no ZooKeeper)
  # -------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7
    container_name: k1-kafka
    environment:
      # KRaft mode: this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners: PLAINTEXT for clients, CONTROLLER for KRaft quorum.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single-node offsets / replication.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # KRaft cluster ID (fixed for dev; generated via
      # `kafka-storage random-uuid` in production).
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Log retention for dev (short).
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kernel-v1-dev
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # ClickHouse 24.8 — analytics / event store
  # -------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: k1-clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface
      - "127.0.0.1:9000:9000"   # Native TCP interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Init script applies the parameterized migrations.
      - ./config/clickhouse-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # Existing migration SQL files (read-only).
      - ../clickhouse:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - kernel-v1-dev
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # -------------------------------------------------------------------
  # SPIRE server — SPIFFE identity provider
  # -------------------------------------------------------------------
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.10
    container_name: k1-spire-server
    command: ["-config", "/etc/spire/server.conf"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config/spire-server.conf:/etc/spire/server.conf:ro
      - spire-server-data:/run/spire/data
      - spire-server-socket:/tmp/spire-server/private
    networks:
      - kernel-v1-dev
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck",
             "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # SPIRE agent — workload attestation (privileged)
  # -------------------------------------------------------------------
  spire-agent:
    build:
      context: .
      dockerfile: Dockerfile.spire-agent-dev
    container_name: k1-spire-agent
    privileged: true
    volumes:
      - ./config/spire-agent.conf:/etc/spire/agent.conf:ro
      # Server admin socket (for join-token generation).
      - spire-server-socket:/tmp/spire-server/private:ro
      # Agent workload API socket (shared with other containers).
      - spire-agent-socket:/tmp/spire-agent/public
    networks:
      - kernel-v1-dev
    depends_on:
      spire-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck",
             "-socketPath", "/tmp/spire-agent/public/api.sock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Dex — OIDC identity provider
  # -------------------------------------------------------------------
  dex:
    image: dexidp/dex:v2.41.1
    container_name: k1-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./config/dex-config.yaml:/etc/dex/config.yaml:ro
    networks:
      - kernel-v1-dev
    healthcheck:
      # distroless image: no shell/curl/wget. Use the binary itself.
      test: ["CMD", "/usr/local/bin/dex", "version"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

# -------------------------------------------------------------------
# Shared network
# -------------------------------------------------------------------
networks:
  kernel-v1-dev:
    name: kernel-v1-dev
    driver: bridge

# -------------------------------------------------------------------
# Named volumes for data persistence
# -------------------------------------------------------------------
volumes:
  postgres-data:
    name: k1-postgres-data
  kafka-data:
    name: k1-kafka-data
  clickhouse-data:
    name: k1-clickhouse-data
  spire-server-data:
    name: k1-spire-server-data
  spire-server-socket:
    name: k1-spire-server-socket
  spire-agent-socket:
    name: k1-spire-agent-socket
