# tmpfiles.d configuration for kernel-v1-agent runtime directory.
#
# Install to: /usr/lib/tmpfiles.d/kernel-v1-agent.conf
# (or /etc/tmpfiles.d/kernel-v1-agent.conf for local overrides)
#
# Creates /run/kernel-v1 owned by the kernel-v1 system user with
# restrictive permissions.  systemd-tmpfiles processes this at boot
# and periodically cleans stale entries.
#
# Type  Path               Mode  UID        GID        Age
d       /run/kernel-v1     0750  kernel-v1  kernel-v1  -
