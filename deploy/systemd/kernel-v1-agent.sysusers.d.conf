# sysusers.d configuration for the kernel-v1 dedicated system user.
#
# Install to: /usr/lib/sysusers.d/kernel-v1-agent.conf
# (or /etc/sysusers.d/kernel-v1-agent.conf for local overrides)
#
# Creates a system user and group with no login shell.  The user
# exists solely to run the kernel-v1-agent systemd service with
# ambient BPF capabilities — it must never be used for interactive
# login or SSH access.
#
# Type  Name       ID    GECOS                          Home directory      Shell
u       kernel-v1  -     "kernel-v1 eBPF agent"         /var/lib/kernel-v1  /usr/sbin/nologin
m       kernel-v1  kernel-v1
