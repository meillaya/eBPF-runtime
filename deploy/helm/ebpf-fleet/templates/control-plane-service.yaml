apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebpf-fleet.fullname" . }}-control-plane
  labels:
    {{- include "ebpf-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: grpc
      port: {{ .Values.controlPlane.grpcPort }}
      targetPort: grpc
    - name: http
      port: {{ .Values.controlPlane.httpPort }}
      targetPort: http
