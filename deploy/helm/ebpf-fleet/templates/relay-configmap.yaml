{{- if .Values.relay.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebpf-fleet.fullname" . }}-relay
  labels:
    {{- include "ebpf-fleet.labels" . | nindent 4 }}
data:
  relay.toml: |
    database_url = ""
    kafka_brokers = {{ toJson .Values.relay.kafkaBrokers }}
    kafka_topic = {{ .Values.relay.kafkaTopic | quote }}
    clickhouse_url = {{ .Values.relay.clickhouseUrl | quote }}
    clickhouse_database = {{ .Values.relay.clickhouseDatabase | quote }}
    poll_ms = 500
    limit = 200
{{- end }}
