{{/*
SPDX-License-Identifier: Apache-2.0 OR MIT

RBAC — minimal read-only access for node/pod enrichment.

The agent enriches events with node and pod metadata. It needs ONLY:
  - nodes: get, list, watch
  - pods: get, list, watch

NO cluster-admin. NO write access. NO secrets access. NO broad RBAC.
*/}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kernel-v1.fullname" . }}
  labels:
    {{- include "kernel-v1.labels" . | nindent 4 }}
rules:
  # Read-only node metadata for enrichment.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Read-only pod metadata for enrichment.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kernel-v1.fullname" . }}
  labels:
    {{- include "kernel-v1.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kernel-v1.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kernel-v1.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
