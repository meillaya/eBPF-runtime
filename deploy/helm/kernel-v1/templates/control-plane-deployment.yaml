{{/*
SPDX-License-Identifier: Apache-2.0 OR MIT

Control-plane Deployment — restricted Pod Security Standards.
Runs with no elevated capabilities, read-only root filesystem,
and all standard security hardening.
*/}}
{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kernel-v1.fullname" . }}-control-plane
  labels:
    {{- include "kernel-v1.controlPlane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "kernel-v1.controlPlane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kernel-v1.controlPlane.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kernel-v1.serviceAccountName" . }}
      # Pod Security Standards: restricted profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: {{ include "kernel-v1.image" (dict "image" .Values.controlPlane.image) }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          args:
            - --bind-addr
            - {{ .Values.controlPlane.bindAddr | quote }}
            - --bind-port
            - {{ .Values.controlPlane.bindPort | quote }}
            - --log-level
            - {{ .Values.controlPlane.logLevel | quote }}
            {{- if .Values.controlPlane.defaultCluster }}
            - --default-cluster
            - {{ .Values.controlPlane.defaultCluster | quote }}
            {{- end }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.bindPort }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- include "kernel-v1.postgresql.env" . | nindent 12 }}
            {{- include "kernel-v1.kafka.env" . | nindent 12 }}
            {{- include "kernel-v1.clickhouse.env" . | nindent 12 }}
            {{- include "kernel-v1.spire.env" . | nindent 12 }}
            {{- include "kernel-v1.oidc.env" . | nindent 12 }}
          volumeMounts:
            # Writable tmp for runtime artifacts.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.controlPlane.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.controlPlane.readinessProbe | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.controlPlane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
