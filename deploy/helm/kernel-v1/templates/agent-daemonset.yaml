{{/*
SPDX-License-Identifier: Apache-2.0 OR MIT

Agent DaemonSet — capability-minimized eBPF node agent.

Pod Security Standards justification:
  The agent requires the `privileged` PSS profile on its namespace because
  it needs CAP_BPF, CAP_PERFMON, CAP_SYS_ADMIN, and CAP_NET_ADMIN to load
  and attach eBPF programs, and read-write access to bpffs/tracefs.
  However, the pod itself is NOT privileged:
    - privileged: false
    - hostPID: false (uses /proc via read-only hostPath mount)
    - hostNetwork: false
    - procMount: Default (NOT Unmasked)
    - Only 4 capabilities added (BPF, PERFMON, SYS_ADMIN, NET_ADMIN)
    - All other capabilities dropped
  The namespace must be labeled:
    pod-security.kubernetes.io/enforce: privileged
  See README.md for the full justification.
*/}}
{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kernel-v1.fullname" . }}-agent
  labels:
    {{- include "kernel-v1.agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kernel-v1.agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.agent.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "kernel-v1.agent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/agent-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kernel-v1.serviceAccountName" . }}
      # Pod Security: NOT privileged, NOT hostPID, NOT hostNetwork.
      # The agent uses a read-only hostPath mount of /proc for process
      # enrichment instead of sharing the host PID namespace.
      hostPID: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: {{ include "kernel-v1.image" (dict "image" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - --listen
            - {{ .Values.agent.listen | quote }}
            - --key
            - {{ .Values.agent.keyPath | quote }}
            - --db
            - {{ .Values.agent.dbPath | quote }}
            - --log-level
            - {{ .Values.agent.logLevel | quote }}
          securityContext:
            # NEVER privileged.
            privileged: false
            # Default procMount — NOT Unmasked.
            procMount: Default
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # Drop ALL capabilities, then add back only the four required
            # for eBPF program loading and attachment.
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - PERFMON
                - SYS_ADMIN
                - NET_ADMIN
          ports:
            - name: http
              containerPort: 9464
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            # /proc mounted read-only for process enrichment (NOT hostPID).
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            # bpffs for BPF map pinning (read-write).
            - name: bpffs
              mountPath: /sys/fs/bpf
            # tracefs for tracepoint/kprobe attachment (read-write).
            - name: tracefs
              mountPath: /sys/kernel/debug/tracing
            # Writable state directory for the SQLite database.
            - name: agent-state
              mountPath: /var/lib/kernel-v1
            # Storage key from Secret (read-only).
            {{- if .Values.secrets.agentStorageKey.name }}
            - name: storage-key
              mountPath: /etc/kernel-v1
              readOnly: true
            {{- end }}
            # Agent config from ConfigMap (read-only).
            - name: agent-config
              mountPath: /etc/kernel-v1/agent.yaml
              subPath: agent.yaml
              readOnly: true
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.agent.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.agent.readinessProbe | nindent 12 }}
      volumes:
        # Specific /proc paths only — read-only hostPath mount.
        - name: host-proc
          hostPath:
            path: {{ .Values.agent.hostPaths.proc }}
            type: Directory
        - name: bpffs
          hostPath:
            path: {{ .Values.agent.hostPaths.bpffs }}
            type: DirectoryOrCreate
        - name: tracefs
          hostPath:
            path: {{ .Values.agent.hostPaths.tracefs }}
            type: DirectoryOrCreate
        - name: agent-state
          hostPath:
            path: /var/lib/kernel-v1
            type: DirectoryOrCreate
        {{- if .Values.secrets.agentStorageKey.name }}
        - name: storage-key
          secret:
            secretName: {{ .Values.secrets.agentStorageKey.name }}
            items:
              - key: {{ .Values.secrets.agentStorageKey.key }}
                path: storage-key
        {{- end }}
        - name: agent-config
          configMap:
            name: {{ include "kernel-v1.fullname" . }}-agent
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
