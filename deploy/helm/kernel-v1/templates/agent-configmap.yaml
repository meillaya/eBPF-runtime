{{/*
SPDX-License-Identifier: Apache-2.0 OR MIT

Agent ConfigMap — non-sensitive agent configuration.
Credentials are NEVER stored here; they come from Secret references.
*/}}
{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kernel-v1.fullname" . }}-agent
  labels:
    {{- include "kernel-v1.agent.labels" . | nindent 4 }}
data:
  agent.yaml: |
    # kernel-v1 agent configuration (non-sensitive).
    # Credentials are injected via environment variables from Secrets.
    listen: {{ .Values.agent.listen | quote }}
    log_level: {{ .Values.agent.logLevel | quote }}
    db_path: {{ .Values.agent.dbPath | quote }}
    key_path: {{ .Values.agent.keyPath | quote }}
    # External service endpoints (non-sensitive).
    spire_server_address: {{ .Values.external.spire.serverAddress | quote }}
{{- end }}
