{{/*
SPDX-License-Identifier: Apache-2.0 OR MIT

Control-plane Service — exposes the control-plane HTTP API.
*/}}
{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kernel-v1.fullname" . }}-control-plane
  labels:
    {{- include "kernel-v1.controlPlane.labels" . | nindent 4 }}
  {{- with .Values.controlPlane.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kernel-v1.controlPlane.selectorLabels" . | nindent 4 }}
{{- end }}
