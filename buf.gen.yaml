# buf.gen.yaml — kernel-v1 Buf code-generation config
#
# Buf v2 generation matrix. Task 6 of
# .omo/plans/ebpf-runtime-security-observability.md.
#
# Task 6 intentionally keeps generation DISABLED. The contract is the
# authoritative artifact (proto/, api/, buf.yaml). Subsequent tasks
# re-enable the Rust and TypeScript plugins and emit artifacts under
# crates/protocol/src/generated/ and web/src/generated/, both of which
# are gitignored and protected by the freshness check in
# `devenv tasks run proto:check`.
#
# Why a placeholder instead of an empty list?
#   * `buf generate` requires at least one plugin entry. We declare a
#     single no-op plugin with `enabled: false` so future tasks can
#     flip the switch without churning the v1 contract. The freshness
#     check (SHA-256 over the source tree) still runs and still asserts
#     deterministic tree digests across two invocations.
#   * This file MUST stay in sync with the Rust/TypeScript codegen
#     landed in tasks 35 and 44; when those land, they re-enable the
#     plugins and add a `default: protocols/grpc-web` / `out:` block.
#
# SPDX-License-Identifier: Apache-2.0 OR MIT

version: v2
plugins:
  # No-op placeholder; intentionally disabled for task 6. The plugin
  # itself is harmless — protoc invokes it once per compile, the
  # `enabled: false` flag suppresses that invocation entirely.
  - local: ["buf.build/protocolbuffers/wellknowns", "v0.1.0"]
    enabled: false
  # Future: Rust tonic stubs re-enabled in task 35 (protobuf contracts
  # for the fleet control plane). Future: TypeScript protobuf-es
  # generated client re-enabled in task 44 (web dashboard). Both are
  # left out of the v1 contract so the source tree is the only
  # authoritative artifact and the freshness check is trivially
  # deterministic.
