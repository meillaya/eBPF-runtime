# rules/default/sensitive-files.yaml — sensitive file access policy pack (task 30)
#
# Detects write-intent and mutation operations on sensitive system files.
# Design principles:
#   - NEVER globally deny /etc or any broad path prefix; only specific
#     sensitive paths and directories are matched.
#   - NEVER deny reads by default; FileOpen gets alert (not deny) because
#     it may be a read-only open.
#   - NEVER act on unresolved/truncated paths; the predicate evaluator
#     treats null/unknown file.path as non-match (false), so truncated
#     paths from the file sensor (task 12) never trigger a rule.
#   - NEVER equate syscall fallback with authoritative LSM decision;
#     deny eligibility rests only on kernel-observable fields (file.path,
#     file.kind) which the file sensor populates from LSM hooks, not from
#     syscall tracepoint fallback.
#   - Audit/deny eligibility is ONLY on authoritative own-LSM facts:
#     file.path and file.kind are kernel-observable (fields.rs catalog);
#     enrichment.* fields are NOT kernel-observable and never appear in
#     a deny condition.
#
# Schema: schemas/rule-v1.schema.json (schema_version 1)
# Engine: 1.0.0 (crates/rules/src/version.rs CURRENT_ENGINE_VERSION)

schema_version: 1  # must be exactly 1 (semantic validator enforces)
engine_version: "1.0.0"  # same major as engine, not newer

rules:
  # -----------------------------------------------------------------------
  # Rule 1: Write-intent detection (alert only, never deny)
  # -----------------------------------------------------------------------
  # Fires when a process opens, creates, or truncates a sensitive file.
  # Action is "alert" (not deny) because FileOpen may be a read-only open;
  # we alert for visibility but do not block. This satisfies the
  # "do not deny reads by default" constraint.
  #
  # Operation constraint: file.kind in [FileOpen, FileCreate, FileTruncate]
  #   - FileOpen: may be write-intent open (we cannot distinguish read vs
  #     write open at the event level, so we alert on all opens to
  #     sensitive paths)
  #   - FileCreate: new file creation in a sensitive location
  #   - FileTruncate: truncation modifies file content (write-intent)
  #
  # Result constraint: file.kind encodes the operation result (what
  #   operation the kernel observed). Only the listed kinds trigger.
  #
  # Source constraint: source=file means this rule applies only to file
  #   sensor events (task 12), not process/network/DNS/syscall events.
  #
  # Identity constraint: exceptions on process.exec_path constrain WHO
  #   may perform the operation without alerting (package managers and
  #   config management tools are trusted actors).
  #
  # Path constraint: only specific sensitive paths are matched via
  #   exact-match list and directory-prefix starts_with. No broad
  #   prefix like /etc is ever used.
  - id: sensitive-file-write-intent
    version: 1
    severity: high  # write-intent on sensitive files is high severity
    tags:
      - file         # event source category
      - sensitive    # sensitive file access
      - write-intent # operation category (open/create/truncate)
    source: file  # file sensor events only (task 12)
    description: >-
      Detects write-intent operations (open, create, truncate) on
      sensitive system files such as /etc/shadow, /etc/passwd,
      /etc/sudoers, SSH host keys, and PAM configuration. Alerts
      but does not deny because FileOpen may be read-only.
      Package managers and config management tools are excepted.
    condition:
      and:
        # Operation constraint: only write-intent file operations.
        # FileOpen is included because we cannot distinguish read-open
        # from write-open at the event level; alerting on all opens
        # to sensitive paths provides visibility without blocking.
        - field: file.kind
          operator: in
          value:
            - "FileOpen"
            - "FileCreate"
            - "FileTruncate"
        # Path constraint: match specific sensitive files and dirs.
        # Uses exact-match for individual files and starts_with for
        # sensitive directories. NEVER uses a broad prefix like /etc.
        - or:
            # Exact sensitive file paths (configurable: edit this list
            # to add/remove individual sensitive files).
            - field: file.path
              operator: in
              value:
                - "/etc/shadow"
                - "/etc/gshadow"
                - "/etc/passwd"
                - "/etc/sudoers"
            # Sensitive directory prefixes (configurable: edit these
            # to add/remove sensitive directory trees).
            - field: file.path
              operator: starts_with
              value: "/etc/ssh/"
            - field: file.path
              operator: starts_with
              value: "/root/.ssh/"
            - field: file.path
              operator: starts_with
              value: "/etc/pam.d/"
    action: alert  # alert only; never deny on write-intent (may be read)
    # Safe exceptions: trusted actors that legitimately modify sensitive
    # files. If process.exec_path matches any exception, the alert is
    # suppressed. These are package managers and config management tools.
    exceptions:
      # Package managers: apt/dpkg (Debian), yum/dnf/rpm (RHEL/Fedora),
      # pacman (Arch), apk (Alpine). These legitimately write to /etc
      # during package installation/upgrade.
      - field: process.exec_path
        operator: in
        value:
          - "/usr/bin/apt"
          - "/usr/bin/apt-get"
          - "/usr/bin/dpkg"
          - "/usr/bin/yum"
          - "/usr/bin/dnf"
          - "/usr/bin/rpm"
          - "/usr/bin/pacman"
          - "/usr/bin/apk"
      # Config management tools: ansible, puppet, chef. These
      # legitimately manage sensitive files as part of configuration
      # enforcement.
      - field: process.exec_path
        operator: in
        value:
          - "/usr/bin/ansible-playbook"
          - "/usr/bin/puppet"
          - "/usr/bin/chef-client"
          - "/opt/chef/bin/chef-client"
    # Configurable path lists: these document the sensitive paths this
    # rule monitors. The condition above inlines the same values because
    # the semantic validator requires array literals for the `in`
    # operator (list-name references are resolved at evaluation time
    # only). Keep these lists in sync with the condition values when
    # adding or removing sensitive paths.
    lists:
      - name: sensitive_write_exact_paths
        items:
          - "/etc/shadow"
          - "/etc/gshadow"
          - "/etc/passwd"
          - "/etc/sudoers"
      - name: sensitive_write_prefix_paths
        items:
          - "/etc/ssh/"
          - "/root/.ssh/"
          - "/etc/pam.d/"
      - name: trusted_package_managers
        items:
          - "/usr/bin/apt"
          - "/usr/bin/apt-get"
          - "/usr/bin/dpkg"
          - "/usr/bin/yum"
          - "/usr/bin/dnf"
          - "/usr/bin/rpm"
          - "/usr/bin/pacman"
          - "/usr/bin/apk"
      - name: trusted_config_management
        items:
          - "/usr/bin/ansible-playbook"
          - "/usr/bin/puppet"
          - "/usr/bin/chef-client"
          - "/opt/chef/bin/chef-client"

  # -----------------------------------------------------------------------
  # Rule 2: Mutation detection (deny-eligible)
  # -----------------------------------------------------------------------
  # Fires when a process renames or unlinks (deletes) a sensitive file.
  # Action is "deny" because mutations are destructive and irreversible;
  # deny is permitted here because the condition references ONLY
  # kernel-observable fields (file.path, file.kind) — never enrichment
  # or heuristic data. This satisfies the "audit/deny eligibility only
  # on authoritative own-LSM facts" constraint.
  #
  # Operation constraint: file.kind in [FileRename, FileUnlink]
  #   - FileRename: renaming a sensitive file (e.g., moving /etc/shadow)
  #   - FileUnlink: deleting a sensitive file (e.g., rm /etc/sudoers)
  #
  # These are unambiguously destructive operations; there is no
  # "read-only rename" or "read-only unlink", so deny is safe.
  #
  # LSM authority: file.path and file.kind are populated by the file
  # sensor (task 12) from LSM hooks (security_inode_rename,
  # security_inode_unlink). When the sensor falls back to syscall
  # tracepoints, the validity flags indicate reduced confidence; the
  # predicate evaluator treats null/unknown file.path as non-match,
  # so syscall-fallback events with unresolved paths never trigger
  # this deny rule.
  - id: sensitive-file-mutation
    version: 1
    severity: critical  # mutation of sensitive files is critical
    tags:
      - file      # event source category
      - sensitive # sensitive file access
      - mutation  # operation category (rename/unlink)
    source: file  # file sensor events only (task 12)
    description: >-
      Detects mutation operations (rename, unlink) on sensitive system
      files. Denies the operation because mutations are destructive.
      Deny is permitted because the condition uses only kernel-observable
      fields (file.path, file.kind from LSM hooks). Package managers
      and config management tools are excepted.
    condition:
      and:
        # Operation constraint: only destructive mutation operations.
        # Rename and unlink are unambiguously destructive; there is no
        # benign rename or unlink of a sensitive file.
        - field: file.kind
          operator: in
          value:
            - "FileRename"
            - "FileUnlink"
        # Path constraint: same sensitive paths as write-intent rule.
        # Exact-match for individual files, starts_with for directories.
        - or:
            - field: file.path
              operator: in
              value:
                - "/etc/shadow"
                - "/etc/gshadow"
                - "/etc/passwd"
                - "/etc/sudoers"
            - field: file.path
              operator: starts_with
              value: "/etc/ssh/"
            - field: file.path
              operator: starts_with
              value: "/root/.ssh/"
            - field: file.path
              operator: starts_with
              value: "/etc/pam.d/"
    action: deny  # deny-eligible: kernel-observable fields only (LSM facts)
    # Same safe exceptions as write-intent rule: package managers and
    # config management tools legitimately rename/unlink sensitive files
    # during package removal or configuration rollback.
    exceptions:
      - field: process.exec_path
        operator: in
        value:
          - "/usr/bin/apt"
          - "/usr/bin/apt-get"
          - "/usr/bin/dpkg"
          - "/usr/bin/yum"
          - "/usr/bin/dnf"
          - "/usr/bin/rpm"
          - "/usr/bin/pacman"
          - "/usr/bin/apk"
      - field: process.exec_path
        operator: in
        value:
          - "/usr/bin/ansible-playbook"
          - "/usr/bin/puppet"
          - "/usr/bin/chef-client"
          - "/opt/chef/bin/chef-client"
    # Configurable path lists (keep in sync with condition values).
    lists:
      - name: sensitive_mutation_exact_paths
        items:
          - "/etc/shadow"
          - "/etc/gshadow"
          - "/etc/passwd"
          - "/etc/sudoers"
      - name: sensitive_mutation_prefix_paths
        items:
          - "/etc/ssh/"
          - "/root/.ssh/"
          - "/etc/pam.d/"
      - name: mutation_trusted_package_managers
        items:
          - "/usr/bin/apt"
          - "/usr/bin/apt-get"
          - "/usr/bin/dpkg"
          - "/usr/bin/yum"
          - "/usr/bin/dnf"
          - "/usr/bin/rpm"
          - "/usr/bin/pacman"
          - "/usr/bin/apk"
      - name: mutation_trusted_config_management
        items:
          - "/usr/bin/ansible-playbook"
          - "/usr/bin/puppet"
          - "/usr/bin/chef-client"
          - "/opt/chef/bin/chef-client"
