name: ebpf-fleet-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ebpf
      POSTGRES_PASSWORD: ebpf
      POSTGRES_DB: control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebpf -d control"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ebpf
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  control-plane:
    build:
      context: .
      target: runtime
    entrypoint: ["/usr/local/bin/ebpf-control-plane"]
    command: ["serve", "--config", "/etc/ebpf-control-plane/control.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./deploy/compose/config/control.toml:/etc/ebpf-control-plane/control.toml:ro

  relay:
    build:
      context: .
      target: runtime
    entrypoint: ["/usr/local/bin/ebpf-relay"]
    command: ["--config", "/etc/ebpf-relay/relay.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      control-plane:
        condition: service_started
    volumes:
      - ./deploy/compose/config/relay.toml:/etc/ebpf-relay/relay.toml:ro

  agent:
    build:
      context: .
      target: runtime
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /usr/local/bin/ebpf-agent init --config /etc/ebpf-agent/agent.toml &&
        exec /usr/local/bin/ebpf-agent run --config /etc/ebpf-agent/agent.toml
    pid: host
    privileged: true
    depends_on:
      control-plane:
        condition: service_started
    volumes:
      - ./deploy/compose/config/agent.toml:/etc/ebpf-agent/agent.toml:ro
      - agent-data:/var/lib/ebpf-agent
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/bpf:/sys/fs/bpf
      - /proc:/proc

volumes:
  postgres-data:
  clickhouse-data:
  agent-data:
