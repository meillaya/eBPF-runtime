# buf.yaml — kernel-v1 Buf module configuration
#
# Buf v2 module declaration. Defines the canonical lint + breaking-check
# policy for every .proto file under proto/. Task 6 of
# .omo/plans/ebpf-runtime-security-observability.md.
#
# Important: this is the v1 contract; `breaking.ignore` is empty because
# there is no prior version to compare against. Future vN+1 contracts
# MUST keep this baseline as the comparison target for
# `buf breaking --against .git#<this-baseline>`.
#
# Lint rules:
#   USE_STD_EMPTY                - allow empty google/protobuf/empty.proto imports
#   PACKAGE_DIRECTORY_MATCH      - proto package must match its directory
#   ENUM_VALUE_PREFIX            - enum values share the enum name as a prefix
#   ENUM_ZERO_VALUE_SUFFIX       - the zero value of an enum is named *_UNSPECIFIED
#   FIELD_LOWER_SNAKE_CASE       - message fields use lower_snake_case
#   RPC_REQUEST_STANDARD_NAME    - request RPCs end with Request
#   RPC_RESPONSE_STANDARD_NAME   - response RPCs end with Response
#   RPC_REQUEST_RESPONSE_UNIQUE  - request/response types are not reused across RPCs
#   SERVICE_SUFFIX               - service names end with Service
#   PACKAGE_VERSION_SUFFIX       - the last package segment is a version (e.g. v1)
#   DIRECTORY_SAME_PACKAGE       - all files in a directory share a package
#
# Breaking rules:
#   FILE              - any .proto file change breaks
#   PACKAGE           - package renames or removals break
# Wire/JSON compatibility and field-number-reuse detection are
# enforced by `buf breaking --against .git#<baseline>`; this file
# declares the per-module policy.
#
# SPDX-License-Identifier: Apache-2.0 OR MIT

version: v2
lint:
  use:
    - STANDARD
  # Allow per-line `// buf:lint:ignore=...` annotations. We do NOT use
  # blanket waivers; every ignore must be justified inline. Default
  # in buf v2 is true; we set the negation explicitly so the option
  # is self-documenting.
  disallow_comment_ignores: false
breaking:
  use:
    - FILE
    - PACKAGE
  # No prior version exists; the baseline is the v1 contract below.
  ignore: []
modules:
  - path: proto
    name: "buf.build/local/kernel-v1"
