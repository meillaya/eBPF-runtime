name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: format
        run: nix develop --no-pure-eval --accept-flake-config -c cargo fmt --all -- --check

      - name: clippy
        run: nix develop --no-pure-eval --accept-flake-config -c cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: nix develop --no-pure-eval --accept-flake-config -c cargo test --workspace

      - name: build sensors
        run: nix develop --no-pure-eval --accept-flake-config -c cargo run -p bpf-build -- build

      - name: build dashboard
        working-directory: web
        run: nix develop .. --no-pure-eval --accept-flake-config -c bash -lc 'bun install --frozen-lockfile && bun run build'

      - name: lint Helm chart
        run: nix shell nixpkgs#kubernetes-helm -c helm lint deploy/helm/ebpf-fleet
