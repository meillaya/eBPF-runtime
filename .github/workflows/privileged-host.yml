# .github/workflows/privileged-host.yml
#
# kernel-v1 privileged CI lane.
#
# This workflow is the sensor / enforcement / compatibility lane. It MUST
# run on declared self-hosted runners that advertise the kernel/arch label
# scheme `kernel-<ver>-arch-<arch>` (e.g. `kernel-5.15-arch-x86_64`). The
# plan forbids emulating privileged success: when no runner with the
# requested labels exists, GitHub Actions will report the job as failed/
# pending and the workflow MUST emit structured `blocked` evidence rather
# than a green check. The first step below is a BTF probe that proves
# /sys/kernel/btf/vmlinux is readable; failure records the blocked
# verdict to a JSON file and exits 77, which the trailing conclude step
# turns into a ::warning:: annotation so reviewers see the blocked
# status without an interactive sudo prompt or a false PASS.
#
# This lane is enabled by workflow_dispatch (operator-controlled) and
# workflow_call (so other workflows can fan it out under a matrix). It is
# NOT triggered on pull_request; cross-tenant code never runs rootful.
#
# SPDX-License-Identifier: Apache-2.0 OR MIT
name: privileged-host

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "Target kernel release family"
        required: true
        type: choice
        options:
          - "5.15"
          - "6.1"
          - "6.6"
          - "current"
      arch:
        description: "Target CPU architecture"
        required: true
        type: choice
        options:
          - "x86_64"
          - "arm64"
  workflow_call:
    inputs:
      kernel:
        description: "Target kernel release family"
        required: true
        type: string
      arch:
        description: "Target CPU architecture"
        required: true
        type: string

permissions:
  contents: read

# Privileged jobs must NEVER cancel each other. Sensor/coroner state on
# the runner must survive a re-run, and concurrency cancellation can drop
# evidence uploads mid-flight. We intentionally leave concurrency unset.

timeout-minutes: 90

jobs:
  privileged-bpf-tests:
    name: "privileged BPF tests (kernel-${{ inputs.kernel }}/${{ inputs.arch }})"
    # Self-hosted runner label scheme (the ONLY path that satisfies the
    # plan). The validator in scripts/validate-workflows.py refuses to
    # PASS any workflow that points a privileged job at ubuntu-* labels.
    runs-on: [self-hosted, kernel-${{ inputs.kernel }}, arch-${{ inputs.arch }}]
    timeout-minutes: 90
    env:
      # Force well-known toolchain locations; the runner image already
      # has devenv on PATH but we re-source here to keep the workflow
      # deterministic across runner upgrades.
      KERNEL_FAMILY: ${{ inputs.kernel }}
      KERNEL_ARCH: ${{ inputs.arch }}
      EVIDENCE_DIR: ${{ runner.temp }}/privileged-evidence
    steps:
      - name: checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hard-block gate. If /sys/kernel/btf/vmlinux is not readable, this
      # is NOT a kernel-v1 privileged runner and the job MUST emit a
      # blocked verdict. We never call sudo, never load modules, never
      # write sysctls to recover - the runner either has BTF or it does
      # not. The exit code 77 is the plan's "blocked" sentinel; the
      # conclude step at the end surfaces it as a ::warning:: without
      # turning the job green.
      - name: probe host BTF (hard blocked gate)
        id: btf-probe
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if ls /sys/kernel/btf/vmlinux >/dev/null 2>&1; then
            echo "btf=present" >> "$GITHUB_OUTPUT"
            echo "[btf-probe] /sys/kernel/btf/vmlinux is readable"
          else
            echo "btf=missing" >> "$GITHUB_OUTPUT"
            echo "::error::Cannot access BTF; this host lacks BPF support"
            jq -n \
              --arg status blocked \
              --argjson exit_code 77 \
              --arg reason "no /sys/kernel/btf/vmlinux; host is not a declared privileged runner" \
              --arg kernel "$KERNEL_FAMILY" \
              --arg arch "$KERNEL_ARCH" \
              --arg host "$(uname -n)" \
              '{schema_version:1,status:$status,exit_code:$exit_code,reason:$reason,kernel:$kernel,arch:$arch,host:$host}' \
              > "$EVIDENCE_DIR/host-blocked.json"
            exit 77
          fi

      # Real privileged suite. Runs scripts/run-privileged-tests.sh which
      # re-probes BTF + CAP_BPF + CAP_PERFMON + LSM.bpf + unprivileged_bpf
      # gate, then invokes scripts/preflight.sh in BPF_TEST_MODE=privileged
      # mode and stitches the result into the privileged.json evidence.
      - name: run privileged BPF suite
        id: privileged-suite
        if: steps.btf-probe.outputs.btf == 'present'
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ./scripts/run-privileged-tests.sh \
            --kernel "$KERNEL_FAMILY" \
            --arch "$KERNEL_ARCH" \
            --out "$EVIDENCE_DIR/privileged.json"
          cat "$EVIDENCE_DIR/privileged.json"
          status="$(jq -r '.status' "$EVIDENCE_DIR/privileged.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == "blocked" ]]; then
            echo "::warning::Privileged suite reported blocked status - check evidence"
            exit 77
          fi

      # Evidence-ledger validation against the v1 schemas. The privileged
      # suite output is validated in-place; failure is a defect in the
      # driver, not a missing-runner artifact.
      - name: validate privileged evidence against v1 schema
        if: always() && steps.btf-probe.outputs.btf == 'present'
        run: |
          set -euo pipefail
          if [[ ! -s "$EVIDENCE_DIR/privileged.json" ]]; then
            echo "::error::privileged.json missing or empty - blocked gate did not emit evidence"
            exit 1
          fi
          bash scripts/validate-evidence.sh "$EVIDENCE_DIR/privileged.json"

      # Always upload the evidence so blocked verdicts are reviewable
      # even when the job is marked failed/pending.
      - name: upload privileged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privileged-evidence-${{ inputs.kernel }}-${{ inputs.arch }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/*.json
          if-no-files-found: warn
          retention-days: 30

      # Conclude. If the BTF probe or the privileged suite reported
      # blocked (exit 77), surface a ::warning:: so reviewers see the
      # degraded status without an interactive sudo prompt. We never
      # turn the job green for a blocked outcome; if a runner is
      # genuinely missing, GitHub Actions itself will leave the job
      # unrunnable until one is provisioned.
      - name: conclude (blocked -> ::warning::, other failure -> error)
        if: always()
        run: |
          set +e
          rc="${{ steps.privileged-suite.outputs.status }}"
          if [[ "$rc" == "blocked" ]]; then
            echo "::warning::Privileged lane produced blocked status (kernel=${{ inputs.kernel }} arch=${{ inputs.arch }}). Inspect uploaded evidence."
            exit 0
          fi
          # If we got here without 'blocked', the privileged suite
          # either passed (and steps above already exited 0) or it
          # failed earlier. In either case, fall through to GitHub's
          # normal exit-code handling.
          if [[ "$rc" == "passed" ]]; then
            echo "::notice::Privileged lane passed for kernel=${{ inputs.kernel }} arch=${{ inputs.arch }}"
          fi
          exit 0
